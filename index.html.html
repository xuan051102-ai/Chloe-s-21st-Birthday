<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chloe's 21st Birthday</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 锁定 9:16 物理手机屏幕比例 */
    .stage-container {
      position: relative;
      aspect-ratio: 9 / 16;
      height: 100vh;
      max-width: 100vw;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      overflow: hidden;
      background-color: transparent;
    }

    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 1;
      background-size: 100% 100%;
      background-position: center;
    }

    .page.active {
      display: block !important;
      z-index: 10;
    }

    /* ================= 整合后的全新 Photobooth 样式 ================= */
    #page-photobooth { background: #000; }
    .pb-view { position: absolute; inset: 0; display: none; z-index: 35; }
    .pb-view.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    .pb-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; z-index: -1; }
    
    /* 按钮位置调整 */
    .pb-choice-row { position: absolute; left: 5%; bottom: 24%; width: 55%; display: flex; gap: 2%; }
    .pb-choice-row img { width: 49%; height: auto; position: relative; }
    
    #pb-single { transform: translateX(36px); }
    #pb-single:active { transform: scale(0.93) translateX(36px); }

    .pb-selected { 
      filter: brightness(1.15); 
    }
    #pb-single.pb-selected { transform: translateX(36px); }
    #pb-single.pb-selected:active { transform: scale(0.93) translateX(36px); }
    #pb-double.pb-selected:active { transform: scale(0.93); }
    
    .pb-take { position: absolute; right: 2.5%; bottom: 2.5%; width: 30%; }
    .pb-back { position: absolute; right: 4%; bottom: 56%; width: 36%; }
    
    .pb-camera { position: relative; width: 88%; background: #000; overflow: hidden; border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,.5); }
    .pb-camera video, .pb-guide { display: block; width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
    .pb-camera video { transform: scaleX(-1); z-index: 1; }
    .pb-guide { z-index: 2; pointer-events: none; }
    
    .pb-progress { color: #fff; font-weight: bold; margin-bottom: 18px; text-shadow: 0 2px 4px #000; font-size: 18px; z-index: 5; }
    .pb-count { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #fff; font-size: 90px; font-weight: bold; text-shadow: 0 3px 8px #000; z-index: 10; }
    
    /* 照片挑选与排版页 */
    #page-arrange { background-color: #ffe6f0; flex-direction: column; padding: 18px 0 10px 0; justify-content: space-between; }
    .pb-arrange-main { width: 92%; height: 75vh; display: flex; gap: 15px; align-items: center; justify-content: center; margin-top: 5px; }
    
    .pb-arrange-card { 
      position: relative; 
      height: 100%; 
      aspect-ratio: 523 / 1749; 
      background: #fff; 
      box-shadow: 0 6px 20px rgba(0,0,0,0.15); 
      overflow: hidden; 
      border-radius: 4px;
    }
    .pb-arrange-card > img { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
    .pb-arrange-slot { position: absolute; background: #eee center/cover; z-index: 2; border: 1px dashed #d81b60; }
    
    .pb-pool { width: 45%; height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px; }
    .pb-pool-item { width: 100%; aspect-ratio: 4 / 3; background: center/cover; border: 2px solid #fff; border-radius: 6px; position: relative; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.15); flex-shrink: 0; }
    .pb-pool-item.chosen { opacity: .35; }
    .pb-pool-item b { position: absolute; right: -5px; top: -5px; width: 22px; height: 22px; background: #d81b60; color: #fff; border-radius: 50%; text-align: center; line-height: 22px; font-size: 12px; font-weight: bold; }
    
    .pb-arrange-footer { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; margin-bottom: 2px; }
    .pb-arrange-footer img { width: 175px; height: auto; object-fit: contain; }
    .pb-disabled { opacity: .4; pointer-events: none; filter: grayscale(1); }

    /* 最终结果预览页 */
    #pb-result { background-color: #ffe6f0; padding: 10px 0 16px 0; justify-content: space-between; }
    
    .pb-result-card { 
      position: relative; 
      height: 73vh; 
      background: #fff; 
      box-shadow: 0 8px 25px rgba(0,0,0,0.15); 
      overflow: hidden; 
      border-radius: 4px;
      margin-top: 10px;
    }
    .pb-result-card > img { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
    .pb-final-photo { position: absolute; background: center/cover; z-index: 2; }
    
    .pb-result-controls { 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
      align-items: center; 
      width: 100%;
      margin-bottom: 12px; 
    }
    .pb-result-controls img { width: 175px; height: auto; object-fit: contain; }
    /* ================= Photobooth 样式结束 ================= */

    .bg-video {
      width: 100%;
      height: 100%;
      object-fit: fill;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .bg-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* Enter 按钮：按下去变小 */
    .enter-btn {
      position: absolute;
      left: 50%;
      top: 60%;
      transform: translate(-50%, -50%);
      z-index: 30;
      width: 42%;
      max-width: 170px;
      cursor: pointer;
      transition: transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
      pointer-events: auto;
    }

    .enter-btn:active {
      transform: translate(-50%, -50%) scale(0.93);
    }

    /* 通用无位移图片按钮：按下去变小，无阴影滤镜变化 */
    .img-btn {
      cursor: pointer;
      transition: transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
      display: block;
      z-index: 30 !important;
      pointer-events: auto !important;
    }
    .img-btn:active {
      transform: scale(0.93);
    }

    /* ================= 选择页面按钮布局 ================= */
    .choose-tasks-container {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      width: 82%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 30;
    }

    .task-btn-wrapper {
      position: relative;
      width: 42%;
      max-width: 130px;
    }

    .task-btn-wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }

    .completed-dot {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 18px;
      height: 18px;
      background-color: #2e7d32;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      display: none;
      z-index: 35;
    }

    .task-btn-wrapper.completed .completed-dot {
      display: block;
    }

    /* ================= 衣柜换装页面 (bg_closet.png) ================= */
    #page-closet {
      background: none;
    }

    .cloth-btn-group {
      position: absolute;
      left: 7%;
      top: 17%;
      width: 32%;
      height: 58%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      z-index: 30;
    }

    .cloth-btn-group img {
      width: 85%;
      max-width: 100px;
      height: 20%;
      object-fit: contain;
    }

    .cloth-display {
      position: absolute !important;
      left: 75% !important;          
      top: 50% !important;           
      height: 55.3% !important;
      width: 41.875% !important;
      object-fit: contain;
      object-position: center;
      z-index: 20 !important;
      transform: translate(-50%, -50%) !important;
      pointer-events: none;
    }

    .cloth-display-small {
      position: absolute !important;
      left: 75% !important;          
      top: 54% !important;           
      height: 46% !important;
      width: 35% !important;
      object-fit: contain;
      object-position: center;
      z-index: 20 !important;
      transform: translate(-50%, -50%) !important;
      pointer-events: none;
    }

    .closet-continue-btn {
      position: absolute !important;
      bottom: 5% !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      width: 55% !important;
      max-width: 200px;
      z-index: 40 !important;
    }

    .full-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 5;
    }

    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      pointer-events: none;
    }

    /* ================= 游戏主菜单界面 (bg_game.png) ================= */
    .game-menu-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 30;
    }

    .game-btn-grid {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 54%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 30;
    }

    .btn-photobooth-style {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .btn-lucky-style {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .btn-home-style {
      width: 32%;
      height: auto;
      object-fit: contain;
      margin-top: 4px;
    }

    .btn-ending-style {
      width: 65%;
      height: auto;
      object-fit: contain;
    }

    /* ================= 抽奖界面 ================= */
    .lucky-btn-container {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 30;
    }

    .lucky-btn-container img {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    /* ================= 蛋糕小游戏界面 ================= */
    .game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      background: #ffebee;
    }

    .kitchen-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url('bg_cake_game.png') no-repeat center center;
      background-size: contain; 
    }

    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .hearts-container {
      position: absolute;
      bottom: 20px;
      right: 16px;
      display: flex;
      gap: 2px;
      z-index: 10;
    }

    .heart-icon {
      object-fit: contain;
      transition: transform 0.3s ease, opacity 0.3s ease, filter 0.3s ease;
    }

    .heart-lost {
      opacity: 0.2;
      filter: grayscale(100%);
      transform: scale(0.7);
    }

    .game-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal-card-img {
      position: relative;
      width: 85%;
      max-width: 300px;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-bg-image {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      z-index: 10;
      pointer-events: none;
    }

    .btn-start-pos {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 58%;
      max-width: 160px;
    }

    .btn-back-pos {
      position: absolute;
      top: 72%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 58%;
      max-width: 160px;
    }

    .btn-continue-pos {
      position: absolute;
      top: 85%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      max-width: 170px;
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="stage-container">

    <!-- 彩带 Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- 第 1 页：欢迎页 -->
    <div id="page1" class="page active">
      <video id="welcome-video" class="bg-video" autoplay loop muted playsinline>
        <source src="bg_welcome.mp4" type="video/mp4">
      </video>
      <img src="btn_enter.png" class="enter-btn" onclick="handleEnter()" alt="Enter">
    </div>

    <!-- 第 2 页：未完成选择页 (bg_choose) -->
    <div id="page2" class="page">
      <video id="choose-video-1" class="bg-video" loop muted playsinline>
        <source src="bg_choose.mp4" type="video/mp4">
      </video>
      <div class="choose-tasks-container">
        <div class="task-btn-wrapper" id="w1-closet">
          <div class="completed-dot"></div>
          <img src="btn_closet.png" class="img-btn" onclick="openCloset()" alt="Closet">
        </div>
        <div class="task-btn-wrapper" id="w1-cake">
          <div class="completed-dot"></div>
          <img src="btn_cake.png" class="img-btn" onclick="startCakeGame()" alt="Cake">
        </div>
      </div>
    </div>

    <!-- 衣柜换装页 (bg_closet.png 图片背景) -->
    <div id="page-closet" class="page">
      <img src="bg_closet.png" class="bg-img" alt="Closet Background">

      <div class="cloth-btn-group">
        <img src="btn_cloth2.png" class="img-btn" onclick="changeCloth('cloth2.png')" alt="Cloth 2">
        <img src="btn_cloth3.png" class="img-btn" onclick="changeCloth('cloth3.png')" alt="Cloth 3">
        <img src="btn_cloth4.png" class="img-btn" onclick="changeCloth('cloth4.png')" alt="Cloth 4">
        <img src="btn_cloth5.png" class="img-btn" onclick="changeCloth('cloth5.png')" alt="Cloth 5">
      </div>

      <img src="cloth1.png" id="current-cloth" class="cloth-display" alt="Character Display">

      <img src="btn_continue2.png" class="img-btn closet-continue-btn" onclick="finishClosetTask()" alt="Continue">
    </div>

    <!-- 第 2.5 页：完成 1 个任务的选择页 (bg_choose2) -->
    <div id="page-choose2" class="page">
      <video id="choose-video-2" class="bg-video" loop muted playsinline>
        <source src="bg_choose2.mp4" type="video/mp4">
      </video>

      <img src="cloth1.png" id="choose2-cloth" class="cloth-display-small" alt="Character Display">

      <div class="choose-tasks-container">
        <div class="task-btn-wrapper" id="w2-closet">
          <div class="completed-dot"></div>
          <img src="btn_closet.png" class="img-btn" onclick="openCloset()" alt="Closet">
        </div>
        <div class="task-btn-wrapper" id="w2-cake">
          <div class="completed-dot"></div>
          <img src="btn_cake.png" class="img-btn" onclick="startCakeGame()" alt="Cake">
        </div>
      </div>
    </div>

    <!-- 第 3 页：两个任务全完成页面 (bg_choose3) -->
    <div id="page-choose3" class="page" onclick="handleChoose3Click()">
      <video id="choose-video-3" class="bg-video" loop muted playsinline>
        <source src="bg_choose3.mp4" type="video/mp4">
      </video>

      <img src="cloth1.png" id="choose3-cloth" class="cloth-display-small" alt="Character Display">
    </div>

    <!-- 动态庆祝视频页 (cele) -->
    <div id="page-cele" class="page">
      <video id="cele-video" class="bg-video" playsinline muted></video>
    </div>

    <!-- 静态吹蜡烛准备页 (blow1.png) -->
    <div id="page-blow1" class="page">
      <img src="blow1.png" class="full-img" alt="Blow Candle Preparation">
    </div>

    <!-- 吹气吹蜡烛视频页 (blow2.mp4) -->
    <div id="page-blow2" class="page">
      <video id="blow2-video" class="bg-video" playsinline muted></video>
    </div>

    <!-- 吹灭蜡烛彩带落页 (blow3.png) -->
    <div id="page-blow3" class="page">
      <img src="blow3.png" class="full-img" alt="Blow Out Candles Final">
    </div>

    <!-- 游戏主菜单界面 (bg_game.png) -->
    <div id="page-bg-game" class="page">
      <img src="bg_game.png" class="full-img" alt="Game Menu">
      <div class="game-btn-grid">
        <img src="btn_photobooth.png" class="img-btn btn-photobooth-style" onclick="goToPhotoBooth()" alt="Photobooth">
        <img src="btn_lucky.png" class="img-btn btn-lucky-style" onclick="goToLucky()" alt="Lucky Draw">
        <img src="btn_home.png" class="img-btn btn-home-style" onclick="goToHome()" alt="Home">
        <img src="btn_ending.png" class="img-btn btn-ending-style" onclick="playEndingVideo()" alt="Ending">
      </div>
    </div>

    <!-- ================= 整合后的全新 Photobooth 模块页面 ================= -->
    <div id="page-photobooth" class="page">
      
      <!-- 1. 选择模式页 -->
      <div id="pb-select" class="pb-view active">
        <img src="bg_photobooth.PNG" class="pb-bg" alt="Photobooth BG">
        <div class="pb-choice-row">
          <img id="pb-single" src="btn_one.png" class="img-btn" onclick="pbSetMode('single')" alt="Single">
          <img id="pb-double" src="btn_two.png" class="img-btn pb-selected" onclick="pbSetMode('double')" alt="Double">
        </div>
        <img src="btn_back.png" class="img-btn pb-back" onclick="pbBackToGame()" alt="Back">
        <img src="btn_takephoto.png" class="img-btn pb-take" onclick="pbStart()" alt="Take photo">
      </div>

      <!-- 2. 拍摄中页 -->
      <div id="pb-shoot" class="pb-view">
        <div class="pb-progress" id="pb-progress">准备拍摄</div>
        <div id="pb-camera" class="pb-camera">
          <video id="pb-video" autoplay muted playsinline></video>
          <img id="pb-guide" class="pb-guide" alt="Pose guide">
          <div id="pb-count" class="pb-count"></div>
        </div>
      </div>

      <!-- 3. 照片挑选与排版页 -->
      <div id="page-arrange" class="pb-view">
        <div class="pb-arrange-main">
          <div id="pb-arrange-card" class="pb-arrange-card">
            <img id="pb-arrange-template" alt="Arrange template">
            <div class="pb-arrange-slot" style="top:2.6%; left:8.5%; width:83.2%; height:16.275%;"></div>
            <div class="pb-arrange-slot" style="top:7.0%; left:8.5%; width:83.2%; height:16.275%;"></div>
            <div class="pb-arrange-slot" style="top:11.4%; left:8.5%; width:83.2%; height:16.275%;"></div>
            <div class="pb-arrange-slot" style="top:15.8%; left:8.5%; width:83.2%; height:16.275%;"></div>
          </div>
          <div id="pb-pool" class="pb-pool"></div>
        </div>
        <div class="pb-arrange-footer">
          <div style="color:#d81b60; font-size:11px; font-weight:bold;">请从右侧挑选 4 张照片</div>
          <img id="pb-continue" src="btn_continue.png" class="img-btn pb-continue pb-disabled" onclick="pbConfirmArrange()" alt="Continue">
        </div>
      </div>

      <!-- 4. 最终合成卡片与下载页 -->
      <div id="pb-result" class="pb-view">
        <div id="pb-result-card" class="pb-result-card">
          <img id="pb-full-template" alt="Photo template">
        </div>
        <div class="pb-result-controls">
          <img src="btn_download.png" class="img-btn" onclick="pbDownload()" alt="Download">
          <img src="btn_back.png" class="img-btn" onclick="pbReset()" alt="Back">
        </div>
      </div>

      <canvas id="pb-canvas" hidden></canvas>
    </div>
    <!-- ================= Photobooth 模块结束 ================= -->

    <!-- Ending 视频播放页 (ending.mp4) -->
    <div id="page-ending" class="page" onclick="handleEndingClick()">
      <video id="ending-video" class="bg-video" playsinline></video>
    </div>

    <!-- 抽奖主界面 (bg_lucky.png) -->
    <div id="page-lucky" class="page">
      <img src="bg_lucky.png" class="full-img" alt="Lucky Draw">
      <div class="lucky-btn-container">
        <img src="btn_try.png" class="img-btn" onclick="startLuckyDraw()" alt="Try">
        <img src="btn_backto.png" class="img-btn" onclick="goToBgGame()" alt="Back">
      </div>
    </div>

    <!-- 抽奖动画播放页 (trying.mp4) -->
    <div id="page-trying" class="page">
      <video id="trying-video" class="bg-video" playsinline muted></video>
    </div>

    <!-- 抽奖结果显示页 -->
    <div id="page-draw-result" class="page" onclick="returnToLucky()">
      <img id="draw-result-img" class="full-img" src="" alt="Draw Result">
    </div>

    <!-- 蛋糕小游戏全屏界面 -->
    <div id="cake-game-page" class="game-container" style="display:none;">
      <div class="kitchen-bg"></div>
      <canvas id="game-canvas"></canvas>

      <div class="hearts-container" id="hearts-container">
        <img src="heart.png" class="heart-icon" id="heart-1" alt="Life 1">

  <script>
    let isClosetDone = false;
    let isCakeDone = false;
    let selectedClothSrc = 'cloth1.png';

    let soundContext = null;
    let bgmTimer = null;
    let bgmGain = null;
    let bgmPlaying = false;

    function getSoundContext() {
      if (!soundContext) soundContext = new (window.AudioContext || window.webkitAudioContext)();
      return soundContext;
    }

    function playTone(frequency, duration, volume = 0.04, type = 'sine', delay = 0) {
      const ctx = getSoundContext();
      const makeTone = () => {
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        const start = ctx.currentTime + delay;
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        oscillator.connect(gain).connect(ctx.destination);
        oscillator.start(start);
        oscillator.stop(start + duration + 0.03);
      };
      if (ctx.state === 'suspended') ctx.resume().then(makeTone).catch(() => {});
      else makeTone();
    }

    function playSound() {
      playTone(988, 0.11, 0.035, 'sine');
      playTone(1318, 0.16, 0.03, 'sine', 0.055);
    }

    function playLuckySound() {
      [392, 523, 659, 784].forEach((note, index) => playTone(note, 0.16, 0.045, 'square', index * 0.13));
    }

    function playCatchSound() {
      playTone(880, 0.11, 0.12, 'triangle');
      playTone(1320, 0.20, 0.09, 'sine', 0.055);
    }

    function playMissSound() {
      playTone(240, 0.22, 0.12, 'sawtooth');
      playTone(170, 0.32, 0.09, 'triangle', 0.08);
    }

    function startBgm() {
      if (bgmPlaying) return;
      const ctx = getSoundContext();
      bgmPlaying = true;
      bgmGain = ctx.createGain();
      bgmGain.gain.value = 0.045;
      bgmGain.connect(ctx.destination);
      const notes = [261.63, 329.63, 392, 329.63, 293.66, 349.23, 440, 349.23];
      let step = 0;
      const playBgmNote = () => {
        if (!bgmPlaying) return;
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = notes[step++ % notes.length];
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.6, ctx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.1);
        oscillator.connect(gain).connect(bgmGain);
        oscillator.start(); oscillator.stop(ctx.currentTime + 1.15);
      };
      playBgmNote();
      bgmTimer = setInterval(playBgmNote, 1200);
    }

    function stopBgm() {
      bgmPlaying = false;
      if (bgmTimer) clearInterval(bgmTimer);
      bgmTimer = null;
      if (bgmGain) bgmGain.gain.setTargetAtTime(0.0001, getSoundContext().currentTime, 0.12);
      bgmGain = null;
    }

    function syncBgm(pageId) {
      stopBgm();
    }

    function showPage(targetPageId) {
      const targetPage = document.getElementById(targetPageId);
      if (!targetPage) return;

      const performSwitch = () => {
        const pages = document.querySelectorAll('.page');
        pages.forEach(p => {
          if (p.id !== targetPageId) {
            p.classList.remove('active');
            const v = p.querySelector('video');
            if (v) v.pause();
          }
        });
        targetPage.classList.add('active');
        syncBgm(targetPageId);
      };

      const targetVideo = targetPage.querySelector('video');

      if (targetVideo) {
        targetVideo.currentTime = 0;
        let playPromise = targetVideo.play();

        const onPlaying = () => {
          targetVideo.removeEventListener('playing', onPlaying);
          performSwitch();
        };

        targetVideo.addEventListener('playing', onPlaying);

        if (playPromise !== undefined) {
          playPromise.catch(e => {
            performSwitch();
          });
        }
        
        setTimeout(() => {
          targetVideo.removeEventListener('playing', onPlaying);
          performSwitch();
        }, 80);
      } else {
        performSwitch();
      }
    }

    let initialMediaStream = null;
    async function requestInitialMediaAccess() {
      if (!navigator.mediaDevices?.getUserMedia) return;
      try {
        initialMediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
      } catch (error) {
        console.warn('Initial media permission was not granted:', error);
      }
    }

    async function handleEnter() {
      playSound();
      await requestInitialMediaAccess();
      showPage('page2');
    }

    function openCloset() {
      playSound();
      showPage('page-closet');
    }

    function changeCloth(clothSrc) {
      playSound();
      selectedClothSrc = clothSrc;
      document.getElementById('current-cloth').src = clothSrc;
      document.getElementById('choose2-cloth').src = clothSrc;
      document.getElementById('choose3-cloth').src = clothSrc;
    }

    function finishClosetTask() {
      playSound();
      isClosetDone = true;
      document.getElementById('choose2-cloth').src = selectedClothSrc;
      document.getElementById('choose3-cloth').src = selectedClothSrc;
      evaluateNextChoosePage();
    }

    function evaluateNextChoosePage() {
      if (isClosetDone && isCakeDone) {
        showPage('page-choose3');
      } else {
        if (isClosetDone) {
          document.querySelectorAll('.task-btn-wrapper')[0].classList.add('completed');
        }
        if (isCakeDone) {
          document.querySelectorAll('.task-btn-wrapper')[1].classList.add('completed');
        }
        showPage('page-choose2');
      }
    }

    let hasTriggeredCele = false;
    function handleChoose3Click() {
      if (hasTriggeredCele) return;
      hasTriggeredCele = true;
      playSound();

      let num = '2';
      const match = selectedClothSrc.match(/\d+/);
      if (match) {
        num = match[0];
        if (num === '4') num = '5';
        else if (num === '5') num = '4';
      }

      const celeVideoSrc = `cele${num}.mp4`;
      const celeVideo = document.getElementById('cele-video');

      celeVideo.src = celeVideoSrc;
      celeVideo.muted = false;
      celeVideo.currentTime = 0;
      celeVideo.loop = false;
      celeVideo.load();

      showPage('page-cele');

      // 修改处：cele视频播完后定格最后一帧 -> 播放 MP3 -> MP3播完进入 blow1 页面
      celeVideo.onended = () => {
        // 1. 让视频暂停在最后一帧
        celeVideo.pause();
        celeVideo.currentTime = celeVideo.duration;

        // 2. 播放你的 MP3 音频文件（请确保同目录下有名为 blow_audio.mp3 的文件）
        const customAudio = new Audio('blow_audio.mp3');
        
        customAudio.play().catch(e => {
          console.warn("音频自动播放受限或文件不存在:", e);
        });

        // 3. 等 MP3 播放完毕后，再跳转到 blow1 页面开始吹蜡烛流程
        customAudio.onended = () => {
          goToBlow1Page();
        };
      };
    }

    function goToBlow1Page() {
      showPage('page-blow1');
      startBlowDetection();
    }

    let audioContext, analyser, micStream;
    let isListeningForBlow = false;
    let blowFrames = 0;

    function startBlowDetection() {
      if (isListeningForBlow) return;
      isListeningForBlow = true;

      const tracks = initialMediaStream?.getAudioTracks?.().filter(track => track.readyState === 'live');
      if (!tracks?.length) { isListeningForBlow=false; alert('需要在 Enter 时允许麦克风，才能吹灭蜡烛。'); return; }
      micStream = new MediaStream(tracks);
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      audioContext.createMediaStreamSource(micStream).connect(analyser);
      checkBlowVolume();
    }

    function checkBlowVolume() {
      if (!isListeningForBlow) return;

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      for (let i = 0; i < 15; i++) {
        sum += dataArray[i];
      }
      let averageLowFreq = sum / 15;

      blowFrames = averageLowFreq > 105 ? blowFrames + 1 : 0;
      if (blowFrames >= 10) {
        onBlowDetected();
      } else {
        requestAnimationFrame(checkBlowVolume);
      }
    }

    function onBlowDetected() {
      if (!isListeningForBlow) return;
      isListeningForBlow = false;

      blowFrames = 0;
      if (audioContext) {
        audioContext.close();
      }

      const blow2Video = document.getElementById('blow2-video');
      blow2Video.src = 'blow2.mp4';
      blow2Video.currentTime = 0;
      blow2Video.loop = false;
      blow2Video.load();

      showPage('page-blow2');

      // 吹气视频 blow2 播完后正常跳到 blow3
      blow2Video.onended = () => {
        showPage('page-blow3');
        startConfetti();
        clearTimeout(blow3Timer);
        blow3Timer = setTimeout(goToMainMenuAfterConfetti, 5000);
      };
    }

    let blow3Timer = null;
    function goToMainMenuAfterConfetti() {
      clearTimeout(blow3Timer);
      blow3Timer = null;
      stopConfetti();
      showPage('page-bg-game');
    }

    /* ================= 整合版 Photobooth 逻辑 ================= */
    const pbAssets = {
      single: { 
        guides: ['photobooth/single_1.PNG', 'photobooth/single_2.png', 'photobooth/single_3.png', 'photobooth/single_4.png'], 
        full: 'full_template_single.png', 
        ratio: 1.51, 
        layout: {x: 0.10, y: 0.031, w: 0.80, h: 0.16, g: 0.044},
        cardAspectRatio: '713 / 2360'
      },
      double: { 
        guides: ['photobooth/double_1.PNG', 'photobooth/double_2.PNG', 'photobooth/double_3.PNG', 'photobooth/double_4.PNG', 'photobooth/double_5.PNG', 'photobooth/double_6.PNG', 'photobooth/double_7.PNG'], 
        full: 'full_template_double.png', 
        ratio: 4/3, 
        layout: {x: 0.085, y: 0.026, w: 0.832, h: 0.16275, g: 0.044},
        cardAspectRatio: '523 / 1749'
      }
    };

    let pbMode = 'double';
    let pbPhotos = [];
    let pbPicked = [null, null, null, null];
    let pbShooting = false;

    const pbVideo = document.getElementById('pb-video');
    const pbCanvas = document.getElementById('pb-canvas');

    function pbShow(id) { 
      document.querySelectorAll('.pb-view').forEach(v => v.classList.remove('active')); 
      document.getElementById(id).classList.add('active'); 
    }

    function pbSetMode(mode) { 
      playSound();
      pbMode = mode; 
      document.getElementById('pb-single').classList.toggle('pb-selected', mode === 'single'); 
      document.getElementById('pb-double').classList.toggle('pb-selected', mode === 'double'); 
    }

    function pbBackToGame() { 
      playSound(); 
      pbShow('pb-select'); 
      goToBgGame(); 
    }

    function pbWait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    function pbWaitForVideo(timeout = 8000) { 
      return new Promise(resolve => {
        const started = performance.now();
        const check = () => {
          if (pbVideo.readyState >= 2 && pbVideo.videoWidth > 0 && pbVideo.videoHeight > 0) return resolve(true);
          if (performance.now() - started >= timeout) return resolve(false);
          requestAnimationFrame(check);
        };
        check();
      }); 
    }
    
    async function pbImage(src) {
      try {
        const response = await fetch(src);
        const blob = await response.blob();
        return new Promise((resolve) => {
          const image = new Image();
          const blobUrl = URL.createObjectURL(blob);
          image.onload = () => {
            URL.revokeObjectURL(blobUrl);
            resolve(image);
          };
          image.onerror = () => resolve(null);
          image.src = blobUrl;
        });
      } catch (e) {
        return new Promise(resolve => {
          const image = new Image();
          image.crossOrigin = "anonymous";
          image.onload = () => resolve(image);
          image.onerror = () => resolve(null);
          image.src = src;
        });
      }
    }

    async function pbStart() {
      if (pbShooting) return;
      playSound(); 
      pbShooting = true; 
      pbPhotos = []; 
      pbPicked = [null, null, null, null];

      const stream = initialMediaStream;
      if (!stream || !stream.getVideoTracks().some(track => track.readyState === 'live')) { 
        alert('需要先在 Enter 时允许相机权限，才能开始拍照。'); 
        pbShooting = false; 
        return; 
      }

      try {
        pbVideo.srcObject = stream; 
        await pbVideo.play();
        if (!await pbWaitForVideo()) throw new Error('Camera video is not ready');
        
        const config = pbAssets[pbMode];
        const cameraContainer = document.getElementById('pb-camera');
        cameraContainer.style.aspectRatio = `${config.ratio} / 1`; 
        pbShow('pb-shoot');

        await Promise.all(config.guides.map(src => pbImage(src)));

        for (let i = 0; i < config.guides.length; i++) {
          document.getElementById('pb-progress').textContent = `拍摄第 ${i + 1} / ${config.guides.length} 张`;
          const currentGuideSrc = config.guides[i];
          document.getElementById('pb-guide').src = currentGuideSrc;
          
          await pbCountdown();
          pbPhotos.push(await pbCaptureWithGuide(currentGuideSrc, config.ratio));
          playCatchSound(); 
          await pbWait(350);
        }

        if (pbMode === 'single') { 
          pbPicked = [0, 1, 2, 3]; 
          pbResult(); 
        } else { 
          pbArrange(); 
        }
      } catch (error) { 
        console.error(error); 
        alert('拍照素材载入失败，请再试一次。'); 
        pbShow('pb-select'); 
      } finally { 
        pbShooting = false; 
      }
    }

    function pbCountdown() { 
      return new Promise(resolve => {
        const el = document.getElementById('pb-count'); 
        let n = 3; 
        el.style.display = 'flex'; 
        el.textContent = n; 
        const t = setInterval(() => {
          n--; 
          if (n) {
            el.textContent = n;
          } else {
            clearInterval(t);
            el.style.display = 'none';
            resolve();
          }
        }, 1000);
      }); 
    }
    
    async function pbCaptureWithGuide(guideSrc, ratio) {
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const vw = pbVideo.videoWidth, vh = pbVideo.videoHeight; 
      let sw = vw, sh = vw / ratio;
      if (sh > vh) { sh = vh; sw = vh * ratio; } 
      const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
      
      pbCanvas.width = 1200; 
      pbCanvas.height = Math.round(1200 / ratio); 
      const c = pbCanvas.getContext('2d');
      
      c.save();
      c.translate(pbCanvas.width, 0);
      c.scale(-1, 1);
      c.drawImage(pbVideo, sx, sy, sw, sh, 0, 0, pbCanvas.width, pbCanvas.height);
      c.restore();

      const guideImg = await pbImage(guideSrc);
      if (guideImg) {
        c.drawImage(guideImg, 0, 0, pbCanvas.width, pbCanvas.height);
      }

      return pbCanvas.toDataURL('image/png');
    }

    function pbArrange() { 
      pbShow('page-arrange'); 
      const cfg = pbAssets[pbMode];
      
      const arrangeCard = document.getElementById('pb-arrange-card');
      arrangeCard.style.aspectRatio = cfg.cardAspectRatio;
      document.getElementById('pb-arrange-template').src = cfg.full;

      const slots = arrangeCard.querySelectorAll('.pb-arrange-slot');
      slots.forEach((slot, i) => {
        slot.style.left = `${cfg.layout.x * 100}%`;
        slot.style.top = `${(cfg.layout.y + i * (cfg.layout.h + cfg.layout.g)) * 100}%`;
        slot.style.width = `${cfg.layout.w * 100}%`;
        slot.style.height = `${cfg.layout.h * 100}%`;
      });

      const pool = document.getElementById('pb-pool'); 
      pool.innerHTML = ''; 
      pbPhotos.forEach((src, i) => {
        const el = document.createElement('div');
        el.className = 'pb-pool-item';
        el.style.backgroundImage = `url(${src})`;
        el.onclick = () => pbToggle(i);
        pool.appendChild(el);
      }); 
      pbRenderPick(); 
    }

    function pbToggle(index) { 
      playSound();
      const present = pbPicked.indexOf(index); 
      if (present >= 0) {
        pbPicked[present] = null; 
      } else { 
        const empty = pbPicked.indexOf(null); 
        if (empty < 0) return; 
        pbPicked[empty] = index; 
      } 
      pbRenderPick(); 
    }

    function pbRenderPick() {
      const slots = document.querySelectorAll('#pb-arrange-card .pb-arrange-slot');
      slots.forEach((slot, i) => {
        slot.style.backgroundImage = pbPicked[i] === null ? 'none' : `url(${pbPhotos[pbPicked[i]]})`;
      });
      document.querySelectorAll('#pb-pool .pb-pool-item').forEach((el, i) => {
        const place = pbPicked.indexOf(i);
        el.classList.toggle('chosen', place >= 0);
        el.innerHTML = place >= 0 ? `<b>${place + 1}</b>` : '';
      });
      document.getElementById('pb-continue').classList.toggle('pb-disabled', pbPicked.includes(null));
    }

    function pbConfirmArrange() { 
      if (pbPicked.includes(null)) return; 
      playSound(); 
      pbResult(); 
    }

    function pbResult() {
      pbShow('pb-result'); 
      const card = document.getElementById('pb-result-card');
      const cfg = pbAssets[pbMode]; 
      
      card.style.aspectRatio = cfg.cardAspectRatio;
      card.querySelectorAll('.pb-final-photo').forEach(el => el.remove()); 
      document.getElementById('pb-full-template').src = cfg.full;

      pbPicked.forEach((photoIndex, i) => {
        const el = document.createElement('div');
        el.className = 'pb-final-photo';
        el.style.left = `${cfg.layout.x * 100}%`;
        el.style.top = `${(cfg.layout.y + i * (cfg.layout.h + cfg.layout.g)) * 100}%`;
        el.style.width = `${cfg.layout.w * 100}%`;
        el.style.height = `${cfg.layout.h * 100}%`;
        el.style.backgroundImage = `url(${pbPhotos[photoIndex]})`;
        card.insertBefore(el, document.getElementById('pb-full-template'));
      });
    }

    function pbReset() { 
      playSound(); 
      pbPhotos = []; 
      pbPicked = [null, null, null, null]; 
      pbShow('pb-select'); 
    }

    async function pbDownload() {
      playSound();
      try {
        const cfg = pbAssets[pbMode]; 
        const [template, ...images] = await Promise.all([
          pbImage(cfg.full), 
          ...pbPicked.map(i => pbImage(pbPhotos[i]))
        ]); 
        
        if (!template || images.some(img => !img)) {
          alert('合成模板或照片加载失败，请检查全尺寸模板图片文件是否存在。');
          return;
        }

        const out = document.createElement('canvas');
        out.width = template.naturalWidth; 
        out.height = template.naturalHeight; 
        const c = out.getContext('2d');

        images.forEach((image, i) => {
          pbCover(c, image, cfg.layout.x * out.width, (cfg.layout.y + i * (cfg.layout.h + cfg.layout.g)) * out.height, cfg.layout.w * out.width, cfg.layout.h * out.height);
        });
        
        c.drawImage(template, 0, 0, out.width, out.height);

        const dataUrl = out.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = `Chloe_${pbMode}_photobooth.png`;
        link.href = dataUrl;
        link.click();
      } catch (err) {
        console.warn('导出遇到限制:', err);
        alert('下载失败，请确保图片与网页在同一目录下。');
      }
    }

    function pbCover(c, image, x, y, w, h) { 
      const r = image.width / image.height, box = w / h; 
      let sx = 0, sy = 0, sw = image.width, sh = image.height;
      if (r > box) { 
        sw = image.height * box; 
        sx = (image.width - sw) / 2; 
      } else { 
        sh = image.width / box; 
        sy = (image.height - sh) / 2; 
      }
      c.drawImage(image, sx, sy, sw, sh, x, y, w, h); 
    }
    /* ================= Photobooth 逻辑结束 ================= */

    function goToLucky() {
      playSound();
      showPage('page-lucky');
    }

    function goToHome() {
      playSound();
      showPage('page1');
    }

    function playEndingVideo() {
      const endingVideo = document.getElementById('ending-video');
      
      endingVideo.pause();
      endingVideo.currentTime = 0;
      endingVideo.muted = false; 
      endingVideo.volume = 1.0;

      }

    function handleEndingClick() {
      playSound();
      showPage('page-bg-game');
    }

    let drawnPool = [];
    let isLuckyAnimating = false;
    let luckyPlayCount = 0;

    function startLuckyDraw() {
      if (isLuckyAnimating) return;
      isLuckyAnimating = true;
      playSound();
      playLuckySound();
      const tryingVideo = document.getElementById('trying-video');
      tryingVideo.src = 'bg_lucky2.mp4';
      tryingVideo.muted = false;
      tryingVideo.currentTime = 0;
      tryingVideo.loop = false;
      tryingVideo.playbackRate = 1;
      tryingVideo.load();

      showPage('page-trying');

      luckyPlayCount = 0;
      tryingVideo.onended = () => {
        luckyPlayCount++;
        if (luckyPlayCount < 2) {
          tryingVideo.currentTime = 0;
          tryingVideo.play();
        } else {
          luckyPlayCount = 0;
          isLuckyAnimating = false;
          performRandomDraw();
        }
      };
    }

    function performRandomDraw() {
      if (drawnPool.length >= 6) {
        drawnPool = [];
      }

      let availableDraws = [];
      for (let i = 1; i <= 6; i++) {
        if (!drawnPool.includes(i)) {
          availableDraws.push(i);
        }
      }

      const randomIndex = Math.floor(Math.random() * availableDraws.length);
      const selectedDraw = availableDraws[randomIndex];

      drawnPool.push(selectedDraw);

      document.getElementById('draw-result-img').src = `draw${selectedDraw}.png`;
      showPage('page-draw-result');
    }

    function returnToLucky() {
      playSound();
      showPage('page-lucky');
    }

    let confettiAnimationId = null;

    function startConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      const stage = document.querySelector('.stage-container');

      canvas.width = stage.clientWidth;
      canvas.height = stage.clientHeight;

      const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4caf50', '#8bc34a', '#cddc39', '#ffeb3b', '#ffc107', '#ff9800'];
      const particles = [];

      for (let i = 0; i < 75; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          w: Math.random() * 8 + 6,
          h: Math.random() * 14 + 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: Math.random() * 4 - 2,
          vy: Math.random() * 3 + 2,
          rotation: Math.random() * 360,
          rotSpeed: Math.random() * 6 - 3
        });
      }

      function renderConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
          ctx.save();
          ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();

          p.x += p.vx;
          p.y += p.vy;
          p.rotation += p.rotSpeed;

          if (p.y > canvas.height) {
            p.y = -20;
            p.x = Math.random() * canvas.width;
          }
        });

        confettiAnimationId = requestAnimationFrame(renderConfetti);
      }

      renderConfetti();
    }

    function stopConfetti() {
      if (confettiAnimationId) {
        cancelAnimationFrame(confettiAnimationId);
        confettiAnimationId = null;
      }
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    const cakeItemsConfig = [
      { src: 'sticker1.png', speed: 8.2 },
      { src: 'sticker2.png', speed: 10.0 },
      { src: 'sticker3.png', speed: 9.2 },
      { src: 'sticker4.png', speed: 8.5 },
      { src: 'sticker5.png', speed: 11.0 },
      { src: 'sticker6.png', speed: 9.8 },
      { src: 'sticker7.png', speed: 12.0 },
      { src: 'sticker8.png', speed: 8.8 },
      { src: 'sticker9.png', speed: 10.5 },
      { src: 'sticker10.png', speed: 9.4 },
      { src: 'sticker11.png', speed: 8.6 },
      { src: 'sticker12.png', speed: 12.2 },
      { src: 'sticker13.png', speed: 9.7 },
      { src: 'sticker14.png', speed: 10.8 },
      { src: 'sticker15.png', speed: 8.9 },
      { src: 'sticker16.png', speed: 12.5 },
      { src: 'sticker17.png', speed: 9.6 },
      { src: 'sticker18.png', speed: 10.2 }
    ];

    let loadedImages = {}; 
    let canvas, ctx;
    let gameAnimationId = null;

    let pot = { x: 0, y: 0, width: 0, height: 0, src: 'pot.png' };
    let itemTargetWidth = 0;
    let items = [];
    let currentItemIndex = 0;
    let lives = 3;
    let spawnTimer = null;
    let isGameRunning = false;

    function preloadGameAssets(callback) {
      let loadedCount = 0;
      let allSources = cakeItemsConfig.map(i => i.src);
      allSources.push(pot.src);
      let totalCount = allSources.length;

      allSources.forEach(src => {
        if (!loadedImages[src]) {
          const img = new Image();
          img.src = src;
          img.onload = () => {
            loadedImages[src] = img;
            loadedCount++;
            if (loadedCount === totalCount && callback) callback();
          };
          img.onerror = () => {
            loadedCount++;
            if (loadedCount === totalCount && callback) callback();
          };
        } else {
          loadedCount++;
          if (loadedCount === totalCount && callback) callback();
        }
      });
    }

    function startCakeGame() {
      playSound();
      getSoundContext().resume();
      document.getElementById('cake-game-page').style.display = 'block';
      canvas = document.getElementById('game-canvas');
      ctx = canvas.getContext('2d');

      const stage = document.querySelector('.stage-container');
      canvas.width = stage.clientWidth;
      canvas.height = stage.clientHeight;

      preloadGameAssets(() => {
        pot.width = canvas.width * 0.28;
        const potImg = loadedImages[pot.src];
        const potAspect = (potImg && potImg.naturalWidth) ? (potImg.naturalHeight / potImg.naturalWidth) : 0.5;
        pot.height = pot.width * potAspect;

        itemTargetWidth = pot.width * 0.85;

        const heartSize = pot.width * 0.6;
        document.querySelectorAll('.heart-icon').forEach(icon => {
          icon.style.width = heartSize + 'px';
          icon.style.height = heartSize + 'px';
        });

        pot.y = canvas.height * 0.90 - pot.height;
        pot.x = (canvas.width - pot.width) / 2;

        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        canvas.addEventListener('mousemove', handleMouseMove);

        resetGameState();
        runGameLoop();
        spawnNextItem();
      });
    }

    function resetGameState() {
      lives = 3;
      currentItemIndex = 0;
      items = [];
      isGameRunning = true;
      updateHeartsDisplay();

      document.getElementById('modal-failed').style.display = 'none';
      document.getElementById('modal-success').style.display = 'none';
    }

    function updateHeartsDisplay() {
      for (let i = 1; i <= 3; i++) {
        const heart = document.getElementById(`heart-${i}`);
        if (i > lives) {
          heart.classList.add('heart-lost');
        } else {
          heart.classList.remove('heart-lost');
        }
      }
    }

    function handleTouchMove(e) {
      e.preventDefault();
      if (!isGameRunning) return;
      const rect = canvas.getBoundingClientRect();
      let touchX = e.touches[0].clientX - rect.left;
      pot.x = touchX - pot.width / 2;
      clampPotX();
    }

    function handleMouseMove(e) {
      if (!isGameRunning) return;
      const rect = canvas.getBoundingClientRect();
      pot.x = (e.clientX - rect.left) - pot.width / 2;
      clampPotX();
    }

    function clampPotX() {
      if (pot.x < 0) pot.x = 0;
      if (pot.x > canvas.width - pot.width) pot.x = canvas.width - pot.width;
    }

    function spawnNextItem() {
      if (currentItemIndex >= cakeItemsConfig.length || !isGameRunning) return;

      const config = cakeItemsConfig[currentItemIndex];
      const spawnY = canvas.height * 0.12;

      const imgObj = loadedImages[config.src];
      let itemWidth = itemTargetWidth;
      let itemHeight = itemTargetWidth;

      if (imgObj && imgObj.naturalWidth) {
        itemHeight = itemTargetWidth * (imgObj.naturalHeight / imgObj.naturalWidth);
      }

      items.push({
        src: config.src,
        speed: config.speed,
        x: Math.random() * (canvas.width - itemWidth - 20) + 10,
        y: spawnY,
        width: itemWidth,
        height: itemHeight
      });

      currentItemIndex++;

      if (currentItemIndex < cakeItemsConfig.length) {
        const randomDelay = Math.floor(Math.random() * 200) + 450;
        spawnTimer = setTimeout(spawnNextItem, randomDelay);
      }
    }

    function runGameLoop() {
      if (!isGameRunning) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const potImg = loadedImages[pot.src];
      if (potImg && potImg.complete) {
        ctx.drawImage(potImg, pot.x, pot.y, pot.width, pot.height);
      }

      for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];
        item.y += item.speed;

        const imgObj = loadedImages[item.src];
        if (imgObj && imgObj.complete) {
          ctx.drawImage(imgObj, item.x, item.y, item.width, item.height);
        }

        if (
          item.y + item.height >= pot.y &&
          item.y <= pot.y + pot.height &&
          item.x + item.width >= pot.x &&
          item.x <= pot.x + pot.width
        ) {
          items.splice(i, 1);
          playCatchSound();
          checkWinCondition();
          continue;
        }

        if (item.y > pot.y + pot.height + 10) {
          items.splice(i, 1);
          onItemMissed();
        }
      }

      gameAnimationId = requestAnimationFrame(runGameLoop);
    }

    function onItemMissed() {
      playMissSound();
      lives--;
      updateHeartsDisplay();

      if (lives <= 0) {
        isGameRunning = false;
        clearTimeout(spawnTimer);
        document.getElementById('modal-failed').style.display = 'flex';
      } else {
        checkWinCondition();
      }
    }

    function checkWinCondition() {
      if (currentItemIndex >= cakeItemsConfig.length && items.length === 0 && lives > 0) {
        isGameRunning = false;
        document.getElementById('modal-success').style.display = 'flex';
      }
    }

    function restartCakeGame() {
      playSound();
      resetGameState();
      runGameLoop();
      spawnNextItem();
    }

    function exitCakeGame() {
      playSound();
      isGameRunning = false;
      clearTimeout(spawnTimer);
      cancelAnimationFrame(gameAnimationId);
      document.getElementById('cake-game-page').style.display = 'none';
    }

    function onCakeGameSuccess() {
      playSound();
      isCakeDone = true;
      exitCakeGame();
      evaluateNextChoosePage();
    }
  </script>
</body>
</html>
